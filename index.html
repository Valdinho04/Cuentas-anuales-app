<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mis Finanzas</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#14171A" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Pantalla de inicio de sesión -->
  <div id="login-screen" class="login-screen">
    <h1>Mis Finanzas</h1>
    <p>Tus movimientos, tarjetas y apartados, sincronizados con tu propia hoja de Google Drive.</p>
    <button id="btn-login" class="btn-google">Conectar con Google</button>
  </div>

  <!-- App principal (oculta hasta iniciar sesión) -->
  <div id="app" style="display:none; display:flex; flex-direction:column; flex:1;">

    <header class="hero">
      <p class="hero-label">Disponible este mes</p>
      <p id="hero-amount" class="hero-amount positive num">$0.00</p>
      <div class="sync-status">
        <span id="sync-dot" class="sync-dot"></span>
        <span id="sync-text">Sincronizado</span>
      </div>
    </header>

    <main id="view-root">
      <!-- las vistas (inicio / tarjetas / apartados / ajustes) se inyectan aquí -->
    </main>

    <button id="fab-add" class="fab" aria-label="Agregar movimiento">+</button>

    <nav class="tabbar">
      <button data-view="inicio" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-7 9 7"/><path d="M5 10v9h14v-9"/></svg>
        Inicio
      </button>
      <button data-view="tarjetas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg>
        Tarjetas
      </button>
      <button data-view="apartados">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v12"/><path d="M6 9l6 6 6-6"/><path d="M4 21h16"/></svg>
        Apartados
      </button>
      <button data-view="ajustes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.6 1.6 0 00-1-1.5 1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H3a2 2 0 110-4h.1a1.6 1.6 0 001.5-1 1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V3a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H21a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg>
        Ajustes
      </button>
    </nav>

  </div>

  <!-- Hoja para registrar un movimiento rápido -->
  <div id="sheet-backdrop" class="sheet-backdrop"></div>
  <div id="add-sheet" class="sheet">
    <h2>Nuevo movimiento</h2>

    <div class="type-toggle" id="type-toggle">
      <button data-type="gasto" class="active">Gasto</button>
      <button data-type="ingreso">Ingreso</button>
      <button data-type="pago_tarjeta">Pago tarjeta</button>
    </div>

    <div class="field">
      <label for="f-monto">Monto</label>
      <input type="number" inputmode="decimal" id="f-monto" class="num" placeholder="0.00" />
    </div>

    <div class="field">
      <label for="f-desc">Descripción</label>
      <input type="text" id="f-desc" placeholder="¿En qué fue?" />
    </div>

    <div class="field">
      <label for="f-categoria">Categoría</label>
      <select id="f-categoria"></select>
    </div>

    <div class="field">
      <label for="f-metodo">Método de pago</label>
      <select id="f-metodo"></select>
    </div>

    <div class="field" id="field-msi" style="display:none;">
      <label for="f-msi">Meses sin intereses</label>
      <select id="f-msi">
        <option value="0">No es MSI</option>
        <option value="3">3 meses</option>
        <option value="6">6 meses</option>
        <option value="9">9 meses</option>
        <option value="12">12 meses</option>
        <option value="18">18 meses</option>
        <option value="24">24 meses</option>
      </select>
    </div>

    <button id="btn-guardar" class="btn-primary">Guardar</button>
    <button id="btn-cancelar" class="btn-text">Cancelar</button>
  </div>

<script src="https://accounts.google.com/gsi/client"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/sheetsApi.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
